<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WorldWide Studio</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

button{
  padding:10px 18px;
  margin:5px;
  cursor:pointer;
}

input{
  margin:5px;
}

#timeline{
  width:95%;
  height:520px;
  margin:30px auto;
  background:#222;
  border:1px solid #555;
  position:relative;
  overflow-x:auto;
  overflow-y:auto;
  touch-action:pan-x;
}

.clip{
  position:absolute;
  height:115px;
  min-width:90px;
  background:#4b8cff;
  border-radius:6px;
  cursor:grab;
  user-select:none;
  padding:6px 14px;
  box-sizing:border-box;
  text-align:left;
  font-size:13px;
  overflow:hidden;
  touch-action:none;
}

.clip.beat{ background:#9b5cff; }
.clip.vocal{ background:#31c48d; }

.clip-name{
  font-weight:bold;
  position:relative;
  z-index:3;
}

.delete-btn{
  float:right;
  padding:2px 7px;
  margin:0;
  font-size:11px;
  background:#ff4444;
  color:white;
  border:none;
  border-radius:4px;
}

.waveform{
  width:100%;
  height:42px;
  margin-top:8px;
  background:rgba(0,0,0,0.25);
  border-radius:4px;
  display:block;
  pointer-events:none;
}

.trim-handle{
  position:absolute;
  top:0;
  width:22px;
  height:100%;
  background:white;
  opacity:0.9;
  cursor:ew-resize;
  z-index:20;
  pointer-events:auto;
  touch-action:none;
}

.trim-handle.left{ left:0; }
.trim-handle.right{ right:0; }

.clip-controls{
  font-size:11px;
  margin-top:8px;
  position:relative;
  z-index:3;
}

.clip-controls input{
  touch-action:auto;
}

#timeRuler{
  height:28px;
  background:#181818;
  border-bottom:1px solid #555;
  position:relative;
  min-width:3600px;
}

.ruler-mark{
  position:absolute;
  top:0;
  height:100%;
  border-left:1px solid #555;
  font-size:10px;
  color:#aaa;
  padding-left:3px;
}
</style>
</head>

<body>

<h1>WorldWide Studio</h1>

<button onclick="createProject()">Create New Project</button>
<br>

<input id="projectCode" placeholder="Project Code" style="padding:10px;text-align:center;text-transform:uppercase;">
<button onclick="joinProject()">Join Project</button>
<button onclick="copyInviteLink()">Copy Invite Link</button>

<p id="projectStatus">No project loaded.</p>
<p id="inviteLink" style="color:#7dd3fc;"></p>

<hr>

<h2>Upload Beat</h2>
<input type="file" id="beat">
<button onclick="uploadBeat()">Upload Beat To Project</button>

<hr>

<h2>Record Vocal Take</h2>

<input id="takeName" placeholder="untitled" style="padding:10px;text-align:center;">
<br>

<button onclick="startRecording()">🎤 Start Recording</button>
<button onclick="stopRecording()">⏹ Stop + Auto Save</button>

<p id="recordStatus"></p>

<audio id="preview" controls style="margin-top:15px;display:none;"></audio>

<hr>

<h2>Timeline</h2>
<p>Drag the middle to move clips. Drag the white sides to trim.</p>

<div id="timeline">
  <div id="timeRuler"></div>
</div>

<button onclick="saveTimeline()">Save Timeline</button>
<button onclick="mixProject()">Export Mix</button>

<p id="status"></p>

<audio id="player" controls style="display:none;margin-top:20px;"></audio>
<p id="link"></p>

<script>
let currentProjectCode = "";
let clips = [];
let autoRefreshTimer = null;
let isDraggingClip = false;
let saveTimer = null;

let mediaRecorder;
let audioChunks = [];
let recordedBlob = null;
let currentStream = null;

const pixelsPerSecond = 20;
const trackHeight = 130;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audioBufferCache = {};

document.addEventListener("touchmove", function(e){
  if(isDraggingClip){
    e.preventDefault();
  }
}, { passive:false });

function drawRuler(){
  const ruler = document.getElementById("timeRuler");
  ruler.innerHTML = "";

  for(let sec=0; sec<=180; sec+=5){
    const mark = document.createElement("div");
    mark.className = "ruler-mark";
    mark.style.left = (sec * pixelsPerSecond) + "px";
    mark.innerText = sec + "s";
    ruler.appendChild(mark);
  }
}

function setProject(code){
  currentProjectCode = code.toUpperCase();

  document.getElementById("projectCode").value = currentProjectCode;
  document.getElementById("projectStatus").innerText =
    "Project loaded: " + currentProjectCode;

  const invite = window.location.origin + "/?project=" + currentProjectCode;
  document.getElementById("inviteLink").innerText = invite;

  startAutoRefresh();
}

function startAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);

  autoRefreshTimer = setInterval(async ()=>{
    if(!currentProjectCode || isDraggingClip) return;
    await loadClips(false);
  },3000);
}

async function createProject(){
  const response = await fetch("/create-project",{method:"POST"});
  const data = await response.json();

  setProject(data.code);
  await loadClips();
}

async function joinProject(){
  const code = document.getElementById("projectCode").value.trim().toUpperCase();
  if(!code) return;

  setProject(code);
  await loadClips();
}

async function copyInviteLink(){
  if(!currentProjectCode) return;

  const invite = window.location.origin + "/?project=" + currentProjectCode;
  await navigator.clipboard.writeText(invite);

  document.getElementById("status").innerText = "Invite link copied.";
}

async function loadClips(showStatus=true){
  if(!currentProjectCode) return;

  const response = await fetch(`/project/${currentProjectCode}/clips`);
  const data = await response.json();

  clips = data.clips || [];
  renderTimeline();

  if(showStatus){
    document.getElementById("status").innerText = "Project refreshed.";
  }
}

async function uploadBeat(){
  if(!currentProjectCode){
    alert("Create or join a project first.");
    return;
  }

  const beat = document.getElementById("beat").files[0];
  if(!beat) return;

  const formData = new FormData();
  formData.append("file",beat);
  formData.append("type","beat");
  formData.append("name","beat");

  await fetch(`/project/${currentProjectCode}/upload-clip`,{
    method:"POST",
    body:formData
  });

  await loadClips();
}

async function startRecording(){
  if(!currentProjectCode){
    alert("Create or join a project first.");
    return;
  }

  currentStream = await navigator.mediaDevices.getUserMedia({audio:true});
  audioChunks = [];

  mediaRecorder = new MediaRecorder(currentStream,{
    mimeType:"audio/webm;codecs=opus"
  });

  mediaRecorder.ondataavailable = e=>{
    if(e.data.size>0) audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async ()=>{
    recordedBlob = new Blob(audioChunks,{
      type:"audio/webm;codecs=opus"
    });

    const url = URL.createObjectURL(recordedBlob);

    const preview = document.getElementById("preview");
    preview.src = url;
    preview.style.display = "block";

    currentStream.getTracks().forEach(track=>track.stop());

    await uploadRecordedTake();
  };

  mediaRecorder.start();

  document.getElementById("recordStatus").innerText = "Recording...";
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state==="recording"){
    mediaRecorder.stop();
    document.getElementById("recordStatus").innerText = "Saving take...";
  }
}

async function uploadRecordedTake(){
  const takeName =
    document.getElementById("takeName").value.trim() ||
    "take_" + Date.now();

  const formData = new FormData();
  formData.append("file",recordedBlob,"recording.webm");
  formData.append("type","vocal");
  formData.append("name",takeName);

  await fetch(`/project/${currentProjectCode}/upload-clip`,{
    method:"POST",
    body:formData
  });

  document.getElementById("recordStatus").innerText = "Take saved.";

  await loadClips();
}

function renderTimeline(){
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = '<div id="timeRuler"></div>';

  drawRuler();

  clips.forEach((clip,index)=>{
    if(clip.trimStart === undefined) clip.trimStart = 0;

    const duration = Number(clip.duration || 8);
    if(!clip.trimEnd || clip.trimEnd <= 0) clip.trimEnd = duration;

    const visibleDuration = Math.max(0.5, clip.trimEnd - clip.trimStart);
    const width = Math.max(90, visibleDuration * pixelsPerSecond);

    const div = document.createElement("div");

    div.className = "clip " + clip.type;
    div.dataset.id = clip.id;

    div.style.left = (Number(clip.start || 0) * pixelsPerSecond) + "px";
    div.style.top = (35 + index * trackHeight) + "px";
    div.style.width = width + "px";

    div.innerHTML = `
      <div class="clip-name">
        ${clip.name} (${clip.type})
        <button class="delete-btn" onclick="deleteClip('${clip.id}')">X</button>
      </div>

      <canvas class="waveform" id="wave-${clip.id}"></canvas>

      <div class="trim-handle left"></div>
      <div class="trim-handle right"></div>

      <div class="clip-controls">
        Vol:
        <input type="range"
          min="0"
          max="2"
          step="0.05"
          value="${clip.volume}"
          oninput="changeClipVolume('${clip.id}',this.value)">

        <span id="vol-${clip.id}">
          ${Math.round(clip.volume*100)}%
        </span>
      </div>
    `;

    timeline.appendChild(div);

    makeDraggable(div,clip);
    makeTrimHandles(div,clip);
    drawRealWaveform(clip, div);
  });
}

async function getAudioBuffer(clip){
  const url = `/projects/${currentProjectCode}/${clip.fileName}`;

  if(audioBufferCache[url]) return audioBufferCache[url];

  const response = await fetch(url);
  const arrayBuffer = await response.arrayBuffer();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

  audioBufferCache[url] = audioBuffer;
  return audioBuffer;
}

async function drawRealWaveform(clip, div){
  try{
    const canvas = document.getElementById("wave-" + clip.id);
    if(!canvas) return;

    const buffer = await getAudioBuffer(clip);

    if(!clip.duration || clip.duration <= 0 || Math.abs(Number(clip.duration) - buffer.duration) > 1){
      clip.duration = buffer.duration;

      if(!clip.trimEnd || clip.trimEnd <= 0 || clip.trimEnd === 8){
        clip.trimEnd = buffer.duration;
      }

      if(clip.trimStart < 0) clip.trimStart = 0;
      if(clip.trimEnd > buffer.duration) clip.trimEnd = buffer.duration;

      scheduleSave();
    }

    canvas.width = div.clientWidth;
    canvas.height = 42;

    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0,0,w,h);

    const data = buffer.getChannelData(0);

    const startSample = Math.floor((clip.trimStart || 0) * buffer.sampleRate);
    const endSample = Math.floor((clip.trimEnd || buffer.duration) * buffer.sampleRate);
    const samples = Math.max(1, endSample - startSample);

    const step = Math.ceil(samples / w);

    ctx.fillStyle = "rgba(255,255,255,0.9)";

    for(let x=0; x<w; x++){
      let min = 1;
      let max = -1;

      const sampleStart = startSample + x * step;
      const sampleEnd = Math.min(sampleStart + step, endSample);

      for(let i=sampleStart; i<sampleEnd; i++){
        const value = data[i] || 0;
        if(value < min) min = value;
        if(value > max) max = value;
      }

      const y1 = ((1 + min) * h) / 2;
      const y2 = ((1 + max) * h) / 2;
      const barHeight = Math.max(1, y2 - y1);

      ctx.fillRect(x, y1, 1, barHeight);
    }
  }catch(err){
    console.warn("Waveform failed:", err);
  }
}

function makeDraggable(element,clip){
  let pointerId = null;
  let isDragging = false;
  let startX = 0;
  let originalLeft = 0;

  element.addEventListener("pointerdown",e=>{
    if(
      e.target.tagName==="INPUT" ||
      e.target.tagName==="BUTTON" ||
      e.target.classList.contains("trim-handle")
    ) return;

    e.preventDefault();

    pointerId = e.pointerId;

    try{
      element.setPointerCapture(pointerId);
    }catch(err){}

    isDragging = true;
    isDraggingClip = true;

    startX = e.clientX;
    originalLeft = parseFloat(element.style.left) || 0;
  });

  element.addEventListener("pointermove",e=>{
    if(!isDragging || e.pointerId !== pointerId) return;

    e.preventDefault();

    let newLeft = originalLeft + (e.clientX - startX);
    if(newLeft < 0) newLeft = 0;

    element.style.left = newLeft + "px";

    clip.start =
      Math.round((newLeft / pixelsPerSecond) * 100) / 100;
  });

  element.addEventListener("pointerup",e=>{
    if(!isDragging || e.pointerId !== pointerId) return;

    scheduleSave();

    isDragging = false;
    isDraggingClip = false;

    try{
      element.releasePointerCapture(pointerId);
    }catch(err){}

    pointerId = null;
  });

  element.addEventListener("pointercancel",()=>{
    isDragging = false;
    isDraggingClip = false;
    pointerId = null;
  });
}

function makeTrimHandles(element, clip){
  const left = element.querySelector(".trim-handle.left");
  const right = element.querySelector(".trim-handle.right");

  let pointerId = null;
  let mode = null;
  let startX = 0;
  let originalLeft = 0;
  let originalWidth = 0;
  let originalTrimStart = 0;
  let originalTrimEnd = 0;

  function startResize(e, resizeMode){
    e.stopPropagation();
    e.preventDefault();

    pointerId = e.pointerId;

    try{
      e.target.setPointerCapture(pointerId);
    }catch(err){}

    mode = resizeMode;
    isDraggingClip = true;

    startX = e.clientX;
    originalLeft = parseFloat(element.style.left) || 0;
    originalWidth = parseFloat(element.style.width) || 90;
    originalTrimStart = Number(clip.trimStart || 0);
    originalTrimEnd = Number(clip.trimEnd || clip.duration || 0);
  }

  function moveResize(e){
    if(!mode || e.pointerId !== pointerId) return;

    e.preventDefault();

    const deltaPx = e.clientX - startX;
    const deltaSec = deltaPx / pixelsPerSecond;

    if(mode === "left"){
      let newTrimStart = originalTrimStart + deltaSec;
      let newLeft = originalLeft + deltaPx;
      let newWidth = originalWidth - deltaPx;

      if(newTrimStart < 0){
        newTrimStart = 0;
        newLeft = originalLeft - (originalTrimStart * pixelsPerSecond);
        newWidth = originalWidth + (originalTrimStart * pixelsPerSecond);
      }

      if(newTrimStart >= originalTrimEnd - 0.25){
        newTrimStart = originalTrimEnd - 0.25;
        newWidth = 0.25 * pixelsPerSecond;
      }

      if(newLeft < 0){
        newLeft = 0;
      }

      clip.trimStart = Math.round(newTrimStart * 100) / 100;
      clip.start = Math.round((newLeft / pixelsPerSecond) * 100) / 100;

      element.style.left = newLeft + "px";
      element.style.width = Math.max(20,newWidth) + "px";
    }

    if(mode === "right"){
      let newTrimEnd = originalTrimEnd + deltaSec;

      if(newTrimEnd > clip.duration){
        newTrimEnd = clip.duration;
      }

      if(newTrimEnd <= originalTrimStart + 0.25){
        newTrimEnd = originalTrimStart + 0.25;
      }

      clip.trimEnd = Math.round(newTrimEnd * 100) / 100;

      const newWidth = Math.max(20, (clip.trimEnd - clip.trimStart) * pixelsPerSecond);
      element.style.width = newWidth + "px";
    }

    drawRealWaveform(clip, element);
  }

  function endResize(e){
    if(!mode || e.pointerId !== pointerId) return;

    scheduleSave();

    try{
      e.target.releasePointerCapture(pointerId);
    }catch(err){}

    mode = null;
    pointerId = null;
    isDraggingClip = false;
  }

  left.addEventListener("pointerdown",e=>startResize(e,"left"));
  right.addEventListener("pointerdown",e=>startResize(e,"right"));

  left.addEventListener("pointermove",moveResize);
  right.addEventListener("pointermove",moveResize);

  left.addEventListener("pointerup",endResize);
  right.addEventListener("pointerup",endResize);

  left.addEventListener("pointercancel",()=>{
    mode = null;
    pointerId = null;
    isDraggingClip = false;
  });

  right.addEventListener("pointercancel",()=>{
    mode = null;
    pointerId = null;
    isDraggingClip = false;
  });
}

function changeClipVolume(id,value){
  const clip = clips.find(c=>c.id===id);
  if(!clip) return;

  clip.volume = Number(value);

  const volText = document.getElementById("vol-" + id);

  if(volText){
    volText.innerText = Math.round(clip.volume*100) + "%";
  }

  scheduleSave();
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);

  saveTimer = setTimeout(async ()=>{
    await saveTimeline();
  },500);
}

async function deleteClip(id){
  await fetch(`/project/${currentProjectCode}/clip/${id}`,{
    method:"DELETE"
  });

  await loadClips();
}

async function saveTimeline(){
  if(!currentProjectCode) return;

  await fetch(`/project/${currentProjectCode}/update-clips`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({clips})
  });
}

async function mixProject(){
  await saveTimeline();

  document.getElementById("status").innerText = "Exporting mix...";

  const response = await fetch(`/project/${currentProjectCode}/mix`,{
    method:"POST"
  });

  if(!response.ok){
    document.getElementById("status").innerText = "Mix failed.";
    return;
  }

  const data = await response.json();

  const player = document.getElementById("player");

  player.src = data.url + "?t=" + Date.now();
  player.style.display = "block";

  document.getElementById("link").innerText =
    "Playable link: " + window.location.origin + data.url;

  document.getElementById("status").innerText = "Mix exported.";
}

async function autoJoinFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get("project");

  if(!code){
    drawRuler();
    return;
  }

  setProject(code);
  await loadClips();
}

autoJoinFromUrl();
</script>

</body>
</html>
